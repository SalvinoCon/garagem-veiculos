<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservas - Garagem de Veículos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 960px; margin: 30px auto; padding: 0 16px; }
        nav a { margin-right: 14px; font-weight: bold; color: #1d4ed8; text-decoration: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select { padding: 8px; box-sizing: border-box; }
        .botao { display: inline-block; padding: 6px 12px; background: #1d4ed8; color: #fff; text-decoration: none; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .botao-vermelho { background: #b91c1c; }
        .botao-cinza { background: #6b7280; }
        .sucesso { background: #dcfce7; color: #166534; padding: 10px; border-radius: 4px; }
        .erro { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 4px; }
        .msg-erro { color: #b91c1c; font-size: 14px; }
        .disponivel { color: #166534; font-weight: bold; }
        .reservado { color: #b91c1c; font-weight: bold; }
        .caixa { border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px; margin-top: 16px; }
        form.inline { display: inline; }
    </style>
</head>
<body>

<nav>
    <a th:href="@{/}">Reservas</a>
    <a th:href="@{/pessoas}">Pessoas</a>
    <a th:href="@{/veiculos}">Veículos</a>
</nav>

<h1>Reservas</h1>

<!-- Mensagens enviadas pelo Controller -->
<p class="sucesso" th:if="${mensagem}" th:text="${mensagem}"></p>
<p class="erro" th:if="${erro}" th:text="${erro}"></p>

<!-- ============ EDITAR PERIODO (aparece so quando clicou em Editar) ============ -->
<div class="caixa" th:if="${reservaEmEdicao}">
    <h2>Editar período da reserva <span th:text="${reservaEmEdicao.id}"></span></h2>
    <form method="post" th:action="@{/reservas/{id}/editar(id=${reservaEmEdicao.id})}">
        <label for="editInicio">Data de início</label>
        <input type="date" id="editInicio" name="dataInicio" th:value="${reservaEmEdicao.dataInicio}" required>

        <label for="editFim">Data de fim</label>
        <input type="date" id="editFim" name="dataFim" th:value="${reservaEmEdicao.dataFim}" required>

        <p>
            <button type="submit" class="botao">Salvar período</button>
            <a class="botao botao-cinza" th:href="@{/}">Cancelar</a>
        </p>
    </form>
</div>

<!-- ============ NOVA RESERVA ============ -->
<div class="caixa" th:unless="${reservaEmEdicao}">
    <h2>Nova reserva</h2>
    <form method="post" th:action="@{/reservas/novo}">
        <label for="veiculoId">Veículo</label>
        <select id="veiculoId" name="veiculoId" required>
            <option value="">Selecione...</option>
            <option th:each="v : ${veiculos}" th:value="${v.id}"
                    th:text="${v.placa + ' - ' + v.modelo}"></option>
        </select>

        <label for="pessoaId">Pessoa</label>
        <select id="pessoaId" name="pessoaId" required>
            <option value="">Selecione...</option>
            <option th:each="p : ${pessoas}" th:value="${p.id}" th:text="${p.nome}"></option>
        </select>

        <label for="dataInicio">Data de início</label>
        <input type="date" id="dataInicio" name="dataInicio" required>

        <label for="dataFim">Data de fim</label>
        <input type="date" id="dataFim" name="dataFim" required>

        <p><button type="submit" class="botao">Reservar</button></p>
    </form>
</div>

<!-- ============ LISTA DE RESERVAS ============ -->
<h2>Reservas cadastradas</h2>
<table>
    <thead>
    <tr>
        <th>Id</th>
        <th>Veículo (placa - modelo)</th>
        <th>Pessoa</th>
        <th>Período</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(linhasReservas)}">
        <td colspan="5">Nenhuma reserva cadastrada.</td>
    </tr>
    <tr th:each="l : ${linhasReservas}">
        <td th:text="${l.reserva.id}"></td>
        <td th:text="${l.veiculo}"></td>
        <td th:text="${l.pessoa}"></td>
        <td th:text="${#temporals.format(l.reserva.dataInicio, 'dd/MM/yyyy') + ' a ' + #temporals.format(l.reserva.dataFim, 'dd/MM/yyyy')}"></td>
        <td>
            <a class="botao" th:href="@{/reservas/{id}/editar(id=${l.reserva.id})}">Editar período</a>
            <form class="inline" method="post"
                  th:action="@{/reservas/{id}/excluir(id=${l.reserva.id})}"
                  onsubmit="return confirm('Tem certeza que deseja cancelar esta reserva?');">
                <button type="submit" class="botao botao-vermelho">Cancelar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<!-- ============ STATUS DOS VEICULOS HOJE ============ -->
<h2>Veículos hoje (<span th:text="${#temporals.format(hoje, 'dd/MM/yyyy')}"></span>)</h2>
<table>
    <thead>
    <tr>
        <th>Placa</th>
        <th>Marca</th>
        <th>Modelo</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(linhasVeiculos)}">
        <td colspan="4">Nenhum veículo cadastrado.</td>
    </tr>
    <tr th:each="l : ${linhasVeiculos}">
        <td th:text="${l.veiculo.placa}"></td>
        <td th:text="${l.veiculo.marca}"></td>
        <td th:text="${l.veiculo.modelo}"></td>
        <td>
            <span class="reservado" th:if="${l.reservado}">Reservado</span>
            <span class="disponivel" th:unless="${l.reservado}">Disponível</span>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
