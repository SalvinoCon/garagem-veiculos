<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pessoa - Garagem de Veículos</title>
    <!-- O visual de todas as telas fica em um unico arquivo: static/css/estilo.css -->
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<!-- Barra do topo com o menu -->
<header class="topo">
    <div class="topo-conteudo">
        <div class="marca">Garagem <span>de Veículos</span></div>
        <nav class="menu">
            <a th:href="@{/}">Reservas</a>
            <a th:href="@{/pessoas}" class="ativo">Pessoas</a>
            <a th:href="@{/veiculos}">Veículos</a>
        </nav>
    </div>
</header>

<main class="pagina estreita">

    <!-- O mesmo formulario serve para CADASTRAR (id = 0) e EDITAR (id > 0) -->
    <div class="cabecalho">
        <h1 th:text="${pessoa.id == 0} ? 'Nova pessoa' : 'Editar pessoa'">Pessoa</h1>
    </div>

    <form class="cartao" method="post" th:object="${pessoa}"
          th:action="${pessoa.id == 0} ? @{/pessoas/novo} : @{/pessoas/{id}/editar(id=${pessoa.id})}">

        <div class="campo">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" th:field="*{nome}">
            <div class="msg-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div class="campo">
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" th:field="*{cpf}" placeholder="111.222.333-44">
            <div class="msg-erro" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
        </div>

        <div class="campo">
            <label for="email">E-mail *</label>
            <input type="text" id="email" th:field="*{email}" placeholder="nome@email.com">
            <div class="msg-erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="campo">
            <label for="telefone">Telefone (opcional)</label>
            <input type="text" id="telefone" th:field="*{telefone}" placeholder="(64) 99999-0001">
        </div>

        <div class="acoes-form">
            <button type="submit" class="botao">Salvar</button>
            <a class="botao claro" th:href="@{/pessoas}">Cancelar</a>
        </div>
    </form>

</main>

</body>
</html>
