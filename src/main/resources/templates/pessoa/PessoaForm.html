<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pessoa - Garagem de Veículos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: topo('pessoas')}"></div>

<main class="pagina estreita">
    <!-- O mesmo formulario serve para CADASTRAR (id = 0) e EDITAR (id > 0) -->
    <h1 th:text="${pessoa.id == 0} ? 'Nova pessoa' : 'Editar pessoa'">Pessoa</h1>

    <form class="cartao" method="post" th:object="${pessoa}"
          th:action="${pessoa.id == 0} ? @{/pessoas/novo} : @{/pessoas/{id}/editar(id=${pessoa.id})}">

        <label for="nome">Nome *</label>
        <input type="text" id="nome" th:field="*{nome}" placeholder="" th:errorclass="campo-erro">
        <div class="msg-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>

        <label for="cpf">CPF *</label>
        <input type="text" id="cpf" th:field="*{cpf}" placeholder="111.222.333-44" th:errorclass="campo-erro">
        <div class="msg-erro" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>

        <label for="email">E-mail *</label>
        <input type="text" id="email" th:field="*{email}" placeholder="nome@email.com" th:errorclass="campo-erro">
        <div class="msg-erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label for="telefone">Telefone (opcional)</label>
        <input type="text" id="telefone" th:field="*{telefone}" placeholder="(64) 99999-0001" th:errorclass="campo-erro">

        <div class="botoes-form">
            <button type="submit" class="botao">Salvar</button>
            <a class="botao botao-cinza" th:href="@{/pessoas}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
