<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pessoa - Garagem de Veículos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 16px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        .msg-erro { color: #b91c1c; font-size: 14px; }
        .botao { display: inline-block; margin-top: 16px; padding: 8px 14px; background: #1d4ed8; color: #fff; text-decoration: none; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .botao-cinza { background: #6b7280; }
    </style>
</head>
<body>

<!-- O mesmo formulario serve para CADASTRAR (id = 0) e EDITAR (id > 0) -->
<h1 th:text="${pessoa.id == 0} ? 'Nova pessoa' : 'Editar pessoa'">Pessoa</h1>

<form method="post" th:object="${pessoa}"
      th:action="${pessoa.id == 0} ? @{/pessoas/novo} : @{/pessoas/{id}/editar(id=${pessoa.id})}">

    <label for="nome">Nome *</label>
    <input type="text" id="nome" th:field="*{nome}">
    <div class="msg-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>

    <label for="cpf">CPF *</label>
    <input type="text" id="cpf" th:field="*{cpf}" placeholder="111.222.333-44">
    <div class="msg-erro" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>

    <label for="email">E-mail *</label>
    <input type="text" id="email" th:field="*{email}" placeholder="nome@email.com">
    <div class="msg-erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

    <label for="telefone">Telefone (opcional)</label>
    <input type="text" id="telefone" th:field="*{telefone}" placeholder="(64) 99999-0001">

    <button type="submit" class="botao">Salvar</button>
    <a class="botao botao-cinza" th:href="@{/pessoas}">Cancelar</a>
</form>

</body>
</html>
