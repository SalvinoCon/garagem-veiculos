<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pessoas - Garagem de Veículos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: topo('pessoas')}"></div>

<main class="pagina">
    <div class="cabecalho">
        <h1>Pessoas</h1>
        <a class="botao" th:href="@{/pessoas/novo}">+ Nova pessoa</a>
    </div>

    <!-- Mensagens enviadas pelo Controller (aparecem so se existirem) -->
    <p class="alerta sucesso" th:if="${mensagem}" th:text="${mensagem}"></p>
    <p class="alerta erro" th:if="${erro}" th:text="${erro}"></p>

    <div class="cartao tabela">
        <table>
            <thead>
            <tr>
                <th>Id</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(pessoas)}">
                <td class="vazio" colspan="6">Nenhuma pessoa cadastrada.</td>
            </tr>
            <tr th:each="x : ${pessoas}">
                <td th:text="${x.id}"></td>
                <td th:text="${x.nome}"></td>
                <td th:text="${x.cpf}"></td>
                <td th:text="${x.email}"></td>
                <td th:text="${x.telefone}"></td>
                <td class="acoes">
                    <a class="botao botao-cinza botao-pequeno" th:href="@{/pessoas/{id}/editar(id=${x.id})}">Editar</a>
                    <!-- Confirmacao antes de excluir -->
                    <form class="inline" method="post"
                          th:action="@{/pessoas/{id}/excluir(id=${x.id})}"
                          onsubmit="return confirm('Tem certeza que deseja excluir esta pessoa?');">
                        <button type="submit" class="botao botao-vermelho botao-pequeno">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
