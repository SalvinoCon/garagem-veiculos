<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veículo - Garagem de Veículos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: topo('veiculos')}"></div>

<main class="pagina estreita">
    <!-- O mesmo formulario serve para CADASTRAR (id = 0) e EDITAR (id > 0) -->
    <h1 th:text="${veiculo.id == 0} ? 'Novo veículo' : 'Editar veículo'">Veículo</h1>

    <form class="cartao" method="post" th:object="${veiculo}"
          th:action="${veiculo.id == 0} ? @{/veiculos/novo} : @{/veiculos/{id}/editar(id=${veiculo.id})}">

        <label for="placa">Placa *</label>
        <input type="text" id="placa" th:field="*{placa}" placeholder="ABC1D23" th:errorclass="campo-erro">
        <div class="msg-erro" th:if="${#fields.hasErrors('placa')}" th:errors="*{placa}"></div>

        <label for="marca">Marca *</label>
        <input type="text" id="marca" th:field="*{marca}" placeholder="Fiat" th:errorclass="campo-erro">
        <div class="msg-erro" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></div>

        <label for="modelo">Modelo *</label>
        <input type="text" id="modelo" th:field="*{modelo}" placeholder="Argo" th:errorclass="campo-erro">
        <div class="msg-erro" th:if="${#fields.hasErrors('modelo')}" th:errors="*{modelo}"></div>

        <label for="ano">Ano *</label>
        <input type="number" id="ano" th:field="*{ano}" placeholder="2022" th:errorclass="campo-erro">
        <div class="msg-erro" th:if="${#fields.hasErrors('ano')}" th:errors="*{ano}"></div>

        <label for="cor">Cor (opcional)</label>
        <input type="text" id="cor" th:field="*{cor}" placeholder="Prata" th:errorclass="campo-erro">

        <div class="botoes-form">
            <button type="submit" class="botao">Salvar</button>
            <a class="botao botao-cinza" th:href="@{/veiculos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
