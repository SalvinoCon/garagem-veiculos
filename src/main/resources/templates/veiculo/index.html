<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veículos - Garagem de Veículos</title>
    <!-- O visual de todas as telas fica em um unico arquivo: static/css/estilo.css -->
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<!-- Barra do topo com o menu -->
<header class="topo">
    <div class="topo-conteudo">
        <div class="marca">Garagem <span>de Veículos</span></div>
        <nav class="menu">
            <a th:href="@{/}">Reservas</a>
            <a th:href="@{/pessoas}">Pessoas</a>
            <a th:href="@{/veiculos}" class="ativo">Veículos</a>
        </nav>
    </div>
</header>

<main class="pagina">

    <div class="cabecalho">
        <div>
            <h1>Veículos</h1>
            <p class="subtitulo">Os carros da garagem.</p>
        </div>
        <a class="botao" th:href="@{/veiculos/novo}">+ Novo veículo</a>
    </div>

    <!-- Mensagens enviadas pelo Controller (aparecem so se existirem) -->
    <p class="aviso sucesso" th:if="${mensagem}" th:text="${mensagem}"></p>
    <p class="aviso erro" th:if="${erro}" th:text="${erro}"></p>

    <div class="cartao tabela-rolagem">
        <table>
            <thead>
            <tr>
                <th>Id</th>
                <th>Placa</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Ano</th>
                <th>Cor</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(veiculos)}">
                <td class="vazio" colspan="7">Nenhum veículo cadastrado.</td>
            </tr>
            <tr th:each="v : ${veiculos}">
                <td class="discreto" th:text="${v.id}"></td>
                <td class="placa" th:text="${v.placa}"></td>
                <td th:text="${v.marca}"></td>
                <td th:text="${v.modelo}"></td>
                <td th:text="${v.ano}"></td>
                <td th:text="${v.cor}"></td>
                <td class="acoes">
                    <a class="botao pequeno claro" th:href="@{/veiculos/{id}/editar(id=${v.id})}">Editar</a>
                    <form class="inline" method="post"
                          th:action="@{/veiculos/{id}/excluir(id=${v.id})}"
                          onsubmit="return confirm('Tem certeza que deseja excluir este veículo?');">
                        <button type="submit" class="botao pequeno perigo">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

</body>
</html>
