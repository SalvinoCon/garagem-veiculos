<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veículos - Garagem de Veículos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: topo('veiculos')}"></div>

<main class="pagina">
    <div class="cabecalho">
        <h1>Veículos</h1>
        <a class="botao" th:href="@{/veiculos/novo}">+ Novo veículo</a>
    </div>

    <!-- Mensagens enviadas pelo Controller (aparecem so se existirem) -->
    <p class="alerta sucesso" th:if="${mensagem}" th:text="${mensagem}"></p>
    <p class="alerta erro" th:if="${erro}" th:text="${erro}"></p>

    <div class="cartao tabela">
        <table>
            <thead>
            <tr>
                <th>Id</th>
                <th>Placa</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Ano</th>
                <th>Cor</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(veiculos)}">
                <td class="vazio" colspan="7">Nenhum veículo cadastrado.</td>
            </tr>
            <tr th:each="x : ${veiculos}">
                <td th:text="${x.id}"></td>
                <td th:text="${x.placa}"></td>
                <td th:text="${x.marca}"></td>
                <td th:text="${x.modelo}"></td>
                <td th:text="${x.ano}"></td>
                <td th:text="${x.cor}"></td>
                <td class="acoes">
                    <a class="botao botao-cinza botao-pequeno" th:href="@{/veiculos/{id}/editar(id=${x.id})}">Editar</a>
                    <!-- Confirmacao antes de excluir -->
                    <form class="inline" method="post"
                          th:action="@{/veiculos/{id}/excluir(id=${x.id})}"
                          onsubmit="return confirm('Tem certeza que deseja excluir este veículo?');">
                        <button type="submit" class="botao botao-vermelho botao-pequeno">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
